spring.application.name=spring-ai-test

spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY}
spring.ai.dashscope.chat.options.model=qwen3.8-flash
spring.ai.dashscope.chat.options.multi-model=true
spring.ai.dashscope.embedding.options.model=qwen3.7-text-rerank

spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.chat.options.model=deepseek-v4-pro
spring.ai.deepseek.embedding.options.model=deepseek-embedding-base

logging.level.org.springframework.ai.chat=DEBUG
logging.level.org.springframework.ai.jdbc.datasource=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.tool.method.MethodToolCallback=DEBUG
logging.level.org.springframework.ai.model.tool.DefaultToolCallingManager=DEBUG
# ?? Jackson ?????
logging.level.com.fasterxml.jackson=DEBUG

spring.ai.chat.memory.repository.jdbc.initalize-schema=always
spring.ai.chat.memory.repository.jdbc.schema=classpath:/sql/schema-mysql.sql